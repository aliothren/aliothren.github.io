- title: Summary
  type: list
  contents:
    - Ph.D. student in Electrical and Computer Engineering at the University of Arizona, working on efficient AI inference. Research spans attention replacement and knowledge distillation for vision transformers, robust and efficient LLM agents, and performance modeling and mapping optimization for analog compute-in-memory systems. Experienced in PyTorch-based model development, simulator implementation, and experimental evaluation.

