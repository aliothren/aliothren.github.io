- title: Industry Experience
  type: time_table
  contents:
    - title: AI Intern
      institution: TetraMem Inc., Fremont, CA, United States
      year: 05/2025-08/2025
      description:
        - Evaluated sequential attention-replacement models, including Mamba-based variants, and token-compression methods under CIM hardware constraints to assess deployment feasibility and guide model adaptation.
        - Adapted FAR models to TetraMem's CIM deployment framework through ONNX conversion, static quantization, and graph decomposition to support hardware-compatible execution.
    - title: Algorithm Intern
      institution: Synkrotron Ltd., Xi'an, China
      year: 05/2023-12/2023
      description:
        - Developed conditional GAN-based methods for generating initial traffic states in the OASIS autonomous-driving simulation platform, producing realistic and diverse microscopic traffic scenarios.
        - Refined behavior-cloning and generative adversarial imitation learning (GAIL) algorithms for traffic-flow control, using learned vehicle behavior to improve simulated traffic dynamics.
        - Processed vehicle trajectory datasets through data cleaning and feature extraction, and analyzed simulated traffic patterns using Python, simulation APIs, and SUMO to support model development and evaluation.
    - title: Graduation Intern
      institution: Siemens AG, Munich, Germany
      year: 07/2022-12/2022
      description:
        - Developed a CNN-based indoor localization system in PyTorch using channel impulse response (CIR) fingerprints, and deployed and tested it in office and industrial environments.
        - Designed transfer-learning and pretraining strategies using larger datasets to improve localization accuracy and training stability when target-domain data were limited.
        - Combined data augmentation with a semi-supervised CNN-WGAN pipeline to address incomplete and imbalanced fingerprint data, improving localization accuracy by up to 25%.

